server:
  port: 8082

spring:
  application:
    name: payment-service
  config:
    # Docker secrets are mounted as files in /run/secrets; each file becomes a property
    # named after the file (e.g. payment_api_password).
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5434/payment}
    username: ${PAYMENT_DB_USERNAME:payment}
    password: ${payment_db_password:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

api:
  auth:
    username: ${PAYMENT_API_USERNAME:payment-client}
    password: ${payment_api_password:}
