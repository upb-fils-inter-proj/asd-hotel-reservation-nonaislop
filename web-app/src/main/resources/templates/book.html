<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Book a room')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
    <p class="steps"><strong>1. Extras</strong> · 2. Review and pay · 3. Confirmation</p>
    <h1>Room <span th:text="${quote.roomNumber}">204</span> · <span th:text="${quote.roomType}">Deluxe</span></h1>
    <div th:replace="~{fragments :: messages}"></div>
    <p class="lead">
        <span th:text="${quote.checkIn}">2026-12-10</span> to <span th:text="${quote.checkOut}">2026-12-13</span>,
        <span th:text="${quote.nights}">3</span> night(s). Room only:
        <strong th:text="${quote.currency} + ' ' + ${quote.total}">EUR 360.00</strong>
    </p>

    <form th:action="@{/book/{room}/review(room=${quote.roomNumber})}" th:object="${bookingForm}" method="post" class="form">
        <input type="hidden" th:field="*{checkIn}">
        <input type="hidden" th:field="*{checkOut}">
        <fieldset>
            <legend>Additional services</legend>
            <label class="check"><input type="checkbox" th:field="*{breakfast}"> Breakfast (per night)</label>
            <label class="check"><input type="checkbox" th:field="*{spa}"> Spa package</label>
            <label class="check"><input type="checkbox" th:field="*{airportTransfer}"> Airport transfer</label>
        </fieldset>
        <button type="submit" class="button">Review price</button>
    </form>
</main>
</body>
</html>
