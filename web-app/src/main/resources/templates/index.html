<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Rooms')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <h1>Find a room</h1>
    <div th:replace="~{fragments :: messages}"></div>
    <form th:replace="~{fragments :: search}"></form>
    <p sec:authorize="isAnonymous()" class="muted">
        Anyone can check availability. <a th:href="@{/register}">Register</a> or <a th:href="@{/login}">log in</a> to book.
    </p>

    <h2>Our rooms</h2>
    <div class="cards">
        <article class="card" th:each="room : ${rooms}">
            <h3 th:text="${room.roomType}">Deluxe</h3>
            <p class="muted">Room <span th:text="${room.roomNumber}">204</span></p>
            <p class="price"><span th:text="${room.currency}">EUR</span> <span th:text="${room.nightlyRate}">100.00</span>
                <span class="muted">/ night</span></p>
        </article>
    </div>
</main>
</body>
</html>
