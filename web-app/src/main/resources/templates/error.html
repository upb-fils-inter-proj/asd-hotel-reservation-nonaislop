<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
    <th:block th:switch="${status}">
        <th:block th:case="403">
            <h1>Not allowed</h1>
            <p>Your account can't open this page.</p>
        </th:block>
        <th:block th:case="404">
            <h1>Page not found</h1>
            <p>There is nothing at this address.</p>
        </th:block>
        <th:block th:case="*">
            <h1>Something went wrong</h1>
            <p>Please try again in a moment.</p>
        </th:block>
    </th:block>
    <p><a th:href="@{/}" class="button">Back to the rooms</a></p>
</main>
</body>
</html>
