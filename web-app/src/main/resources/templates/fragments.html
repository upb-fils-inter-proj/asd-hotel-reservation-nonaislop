<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Hotel Reservations'">Hotel Reservations</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="nav" class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/}">Hotel Reservations</a>
        <nav>
            <a th:href="@{/}">Rooms</a>
            <a sec:authorize="hasRole('GUEST')" th:href="@{/#search}">Book a room</a>
            <a sec:authorize="hasRole('GUEST')" th:href="@{/reservations}">My reservations</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Administration</a>
            <a sec:authorize="isAnonymous()" th:href="@{/login}">Log in</a>
            <a sec:authorize="isAnonymous()" th:href="@{/register}" class="button small">Register</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="logout">
                <span class="who" th:text="${#authentication.principal.name}">Guest</span>
                <button type="submit" class="linklike">Log out</button>
            </form>
        </nav>
    </div>
</header>

<form th:fragment="search" id="search" th:action="@{/rooms/available}" method="get" class="search">
    <label>Check-in <input type="date" name="checkIn" th:value="${checkIn}" th:min="${today}" required></label>
    <label>Check-out <input type="date" name="checkOut" th:value="${checkOut}" th:min="${today}" required></label>
    <button type="submit" class="button">Check availability</button>
</form>

<div th:fragment="messages">
    <p class="notice" th:if="${message}" th:text="${message}">Saved.</p>
    <p class="alert" th:if="${error}" th:text="${error}">Something went wrong.</p>
</div>

</body>
</html>
