# MQTT broker for the service-to-service messages (see docs/architecture.md).
# Every client logs in; what each one may read or write is limited by the ACL file.
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
